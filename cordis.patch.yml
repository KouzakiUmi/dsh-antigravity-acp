# 两行组件：
# - llm-antigravity-acp：官方 ACP 宿主（默认模式），不写入任何 agent-default-model row；
# - antigravity-proxy-router：代理模式路由（默认关闭，proxyMode 开启后注册
#   antigravity-proxy 并由宿主行注销 antigravity-acp，两者互斥）。
- insert:
    - id: llm-antigravity-acp
      name: dsh-bundle-antigravity-host
      inject: [llm, subprocess]
    - id: antigravity-proxy-router
      name: dsh-bundle-antigravity-host/proxy
      inject: [llm, antigravityProxyAuth, antigravityProxyMode]
