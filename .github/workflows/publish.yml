name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json")); assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`)'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run CI checks
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts --json | node scripts/check-npm-pack.mjs

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
